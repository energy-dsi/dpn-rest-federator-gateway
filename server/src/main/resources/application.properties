# REST Federator Server
# Uses the same common.configuration properties file as the gRPC Federator.
# Set SERVER_PROPS env var to point to the main properties file.

spring.application.name=rest-federator-server

# mTLS — enforces mutual TLS (same certs managed by federator-certificate-manager)
server.port=${SERVER_PORT:8443}
server.ssl.bundle=federator-tls
server.ssl.client-auth=${SERVER_SSL_CLIENT_AUTH:need}

# The 'federator-tls' bundle itself is registered programmatically by
# VaultSslBundleRegistrar (an SslBundleRegistrar bean), not declared here via
# spring.ssl.bundle.jks.*. Spring's own file-based bundle registrar
# (SslPropertiesBundleRegistrar) eagerly loads the keystore file the moment
# any spring.ssl.bundle.jks.federator-tls.* property exists — before our
# registrar even runs — so declaring both here would crash startup with
# "Could not load store from '/tls/keystore.p12'" even though Vault is the
# active source of the certificate material.

# Spring OAuth2 resource server — validates inbound Bearer tokens via Keycloak JWKS.
# Sourced from idp.jwks.url in common.configuration (the same value the federator
# stack uses), published here by FederatorCommonConfigEnvironmentPostProcessor.
# Consumed by JwtDecoderConfig, which fetches the JWKS through the federator
# truststore rather than the JVM's cacerts.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${idp.jwks.url}


# Internal backend (data-source API) the gateway forwards authorized requests to.
# The gateway holds no business logic: once JWT, consumer, OCSP and method+path
# authorisation pass, the request is proxied verbatim to this host.
#   BACKEND_BASE_URL — in-cluster service DNS name of the backend
#   BACKEND_API_KEY  — shared secret; sourced from a Kubernetes Secret, never committed.
#                      Sent to the backend as the X-Backend-Api-Key header.
backend.base-url=${BACKEND_BASE_URL:http://dpn-demo-runner-server:8080}
backend.api-key=${BACKEND_API_KEY:}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.org.dsi.dpn.federator.rest=INFO
logging.level.org.springframework.security=WARN
