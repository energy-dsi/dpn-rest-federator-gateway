#
# REST Federator Client properties — used by rest-federator-client and by
# applications embedding it (e.g. demo/demo-runner-client).
#
# SCOPE: this file is for LOCAL DEVELOPMENT. The ${VAR} placeholders below are
# literal text — nothing expands them at runtime, so substitute real values (or
# run the file through envsubst) when running locally.
#
# In a cluster these properties are rendered from Helm values into a ConfigMap
# and mounted at /config instead; see
# charts/dpn-rest-federator/templates/rest-federator-server-config.yaml.
#
# Only properties the REST client actually reads are listed. The gRPC
# Federator's Kafka, JobRunr, file-streaming and cloud-storage (S3/Azure/GCP)
# settings do not apply here and have been removed.
#
# The file is located via the FEDERATOR_CLIENT_PROPERTIES environment variable;
# it defaults to "client.properties" on the classpath.

# Path to the shared IDP/TLS configuration (see common-configuration.properties).
common.configuration=src/configs/common-configuration.properties

# ============================================
# Federator identity
# ============================================

# Consumer ID for this federator instance. Optional.
federator.consumer.id=

# ============================================
# REST client behaviour
# ============================================

# Name of the DSM data product to call. Must match the product name in the
# consumer configuration served by the Management Node (visible on the
# Integration Pathway tab in DSM). May instead be passed as an argument or,
# for the demo client, via the PRODUCT_NAME environment variable.
federator.rest.product.name=

# HTTP read timeout in seconds for outbound calls. Default 60.
federator.rest.read.timeout.seconds=60

# ============================================
# Management Node
# ============================================

# Base URL of the Management Node, which serves this consumer's configuration
# (available producers, their endpoints and allowed paths).
management.node.base.url=https://localhost:8090

# Request timeout in seconds for Management Node calls.
management.node.request.timeout=5

# How long a fetched configuration is cached locally, in seconds.
management.node.cache.ttl.seconds=60

# ============================================
# Management Node resilience (retry / circuit breaker)
# ============================================
# All optional — the defaults shown are applied when a property is absent.

management.node.resilience.retry.maxAttempts=10
management.node.resilience.retry.initialWait=PT5.0S
management.node.resilience.retry.maxBackoff=PT15M
management.node.resilience.retry.retryOn=java.io.IOException,java.net.SocketTimeoutException

management.node.resilience.circuitBreaker.failureRateThreshold=50
management.node.resilience.circuitBreaker.slidingWindowSize=10
management.node.resilience.circuitBreaker.minimumNumberOfCalls=20
management.node.resilience.circuitBreaker.permittedNumberOfCallsInHalfOpenState=1
management.node.resilience.circuitBreaker.waitDurationInOpenState=PT60S

# ============================================
# Redis — IDP access-token cache
# ============================================

redis.host=localhost
redis.port=6379

# An empty value means false; omitting the property entirely means true.
redis.tls.enabled=false

# Key prefix for entries written by this instance.
redis.prefix=federator-client

# Set only if the Redis instance requires authentication. Leave the username
# empty when only a password is needed.
redis.username=
redis.password=

# Base64-encoded AES key used to encrypt cached access tokens.
redis.aes.key=

# ============================================
# Demo client parameters (demo/demo-runner-client only)
# ============================================
# Each is overridden by the matching environment variable, which is how the
# Kubernetes Job supplies them. Left blank here so a run without them still
# uses the client's built-in demo defaults.

# MPAN, POSTCODE
federator.rest.demo.mpan=
federator.rest.demo.postcode=

# ASSET_ID, FSP_ID — blank omits assetId and generates a random FSP id.
federator.rest.demo.asset.id=
federator.rest.demo.fsp.id=

# SENDER_FMAR_ID, SENDER_ROLE, CONTRACTUAL_AUTHORISATION
federator.rest.demo.sender.id=
federator.rest.demo.sender.role=FSP
federator.rest.demo.contractual.authorisation=true
