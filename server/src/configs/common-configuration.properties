#
# Shared Identity Provider and TLS configuration, read by both the REST
# Federator gateway and the REST client. Referenced from server.properties /
# client.properties via the "common.configuration" key.
#
# SCOPE: this file is for LOCAL DEVELOPMENT. The ${VAR} placeholders below are
# literal text — nothing expands them at runtime, so substitute real values (or
# run the file through envsubst) when running locally.
#
# In a cluster these properties are rendered from Helm values into a ConfigMap
# and mounted at /config instead; see
# charts/dpn-rest-federator/templates/rest-federator-server-config.yaml.
#
# Only properties the REST stack actually reads are listed.
#
# The gateway also publishes idp.keystore.*, idp.truststore.*, idp.jwks.url
# and idp.client.id into the Spring Environment
# (FederatorCommonConfigEnvironmentPostProcessor) so application.properties can
# reference them as placeholders — keystore paths and passwords are therefore
# defined here once and used by both the HTTPS connector and the mTLS clients.

# ============================================
# MASTER SWITCH - Redis TLS + Keycloak gating (see KeycloakAuthConfig / RedisUtil)
# ============================================
# Ported from dpn-federator-gateway's common-configuration.properties so this gateway's Redis
# access control matches the gRPC Federator Gateway's:
#
#   keycloak.auth.enabled=true  (default, and the fail-secure outcome of any config error)
#     - This REST Federator Server authenticates to Keycloak via client secret for a Bearer
#       Token, using the dedicated "redis.idp." client below (separate from the "idp." client
#       used for the Management Node/backend connection)
#     - Every Redis access is gated behind KeycloakSessionGuard - see
#       RedisUtil.getKeycloakGatedInstance()
#     - Redis communication is always TLS-encrypted with SAN/hostname verification, using the
#       common DPN certificate configured below
#
#   keycloak.auth.enabled=false (LOCAL DEVELOPMENT TESTING ONLY - never in a real environment)
#     - No Keycloak authentication is performed anywhere Redis is touched
#     - This REST Federator Server accesses Redis directly, unauthenticated, but STILL over TLS
#
# Redis wire-level TLS (redis.tls.enabled, in the Redis TLS configuration section below) is
# controlled SOLELY by that property and is completely independent of keycloak.auth.enabled -
# Redis TLS behaves the same way regardless of this switch's value. Only the Keycloak
# authentication step above (via KeycloakSessionGuard) is affected by keycloak.auth.enabled, not
# TLS. This matches the gRPC Federator Gateway's actual RedisUtil/KeycloakAuthConfig code exactly
# - see KeycloakAuthConfig's Javadoc for the full, current scope of this flag.
#
# This intentionally does NOT affect the gateway's own inbound HTTPS listener TLS, its mTLS
# connection to the backend/Management Node, or the Vault connection - those remain governed by
# their own separate configuration regardless of this flag.
keycloak.auth.enabled=true

# ============================================
# Identity Provider (IDP)
# ============================================

# OAuth2 client ID registered with the IDP. Also returned to consumers as this
# producer's identity.
idp.client.id=FEDERATOR_ENV

# Client-authentication mode: private_key_jwt (recommended), mtls, or
# client_secret.
#
# idp.client.secret is deliberately absent: private_key_jwt needs no shared
# secret, and a secret does not belong in a config file. The client_secret and
# mtls modes read it from the environment or a mounted secret instead — see the
# keyvault block in the Helm values.
idp.auth.mode=client_secret

# Added for local client_secret-mode testing. Not present by design in the
# original file (see comment above) — this is a local-dev-only override.
idp.client.secret=4GoG46J8lRbd5BkYVYm9Mw7EOPc6UVIe

# Legacy boolean, consulted only when idp.auth.mode is unset.
idp.mtls.enabled=true

# Token endpoint used to obtain OAuth2 access tokens.
idp.token.url=https://localhost:8443/realms/mng-node/protocol/openid-connect/token

# JWKS endpoint used to verify inbound JWT signatures.
idp.jwks.url=https://localhost:8443/realms/mng-node/protocol/openid-connect/certs

# Signing algorithm and keystore alias for the private_key_jwt client
# assertion, e.g. RS256.
idp.jwt.algorithm=${IDP_JWT_ALGORITHM}
idp.jwt.key.alias=${IDP_JWT_KEY_ALIAS}

# ============================================
# TLS material (mutual TLS)
# ============================================

# Client keystore (PKCS12) presented for mTLS and used to sign JWT assertions.
idp.keystore.path=../otel-test-certs/identity/identity.p12
idp.keystore.password=changeit

# Truststore holding the CA chain used to verify peers (IDP, Management Node,
# and the counterparty DPN).
idp.truststore.path=./truststore.jks
idp.truststore.password=changeit

# ============================================
# HashiCorp Vault (optional)
# ============================================
# When vault.uri is set, keystore/truststore passwords — and, with
# vault.tls.enabled, the TLS material itself — are resolved from Vault instead
# of the values above. Leave vault.uri blank to disable and use the
# file-and-password configuration as given.

vault.uri=https://localhost:8202

# Truststore used when connecting to Vault itself.
vault.truststore.path=./truststore.jks
vault.truststore.password=changeit

# Authentication method: TOKEN (default) or APPROLE.
#   TOKEN   — uses a pre-issued token from the VAULT_TOKEN environment variable.
#   APPROLE — authenticates with a role-id and secret-id, and renews the lease.
vault.auth.method=TOKEN

# AppRole credentials, used when vault.auth.method=APPROLE.
#
# Resolution order (first non-blank wins):
#   role-id    VAULT_ROLE_ID env var, then this property.
#   secret-id  VAULT_SECRET_ID env var, then the file named by
#              vault.approle.secret-id-path, then this property.
#
# The file form is preferred in Kubernetes: mount the secret-id as a file so
# the value never appears in the process environment.
vault.approle.role-id=${VAULT_APPROLE_ROLE_ID}
vault.approle.secret-id=${VAULT_APPROLE_SECRET_ID}
vault.approle.secret-id-path=${VAULT_APPROLE_SECRET_ID_PATH}

# Vault mount path for the AppRole auth backend.
vault.approle.mount-path=${VAULT_APPROLE_MOUNT_PATH}

# How often, in seconds, the AppRole token lease is renewed.
vault.approle.renewal-interval-seconds=${VAULT_APPROLE_RENEWAL_INTERVAL_SECONDS}

# Read the TLS keystore and truststore directly from Vault rather than from
# the idp.keystore.path / idp.truststore.path files above. This is what
# removes the need for a shared file mount to distribute certificates.
vault.tls.enabled=true

# Vault path holding the TLS material. Defaults to "node-net/client".
vault.tls.secret-base-path=node-net/client

# Alias under which the certificate and key are stored in the generated
# keystore. Defaults to "federator".
vault.tls.keystore-alias=federator

# ============================================
# Dedicated Keycloak client for gating Redis access (KeycloakSessionGuard)
# ============================================
# Intentionally a SEPARATE Keycloak client from the idp.* settings above - different
# realm/client/URLs, no shared session with the management-node/backend connection. Lives in
# this SAME file, distinguished only by the "redis.idp." prefix - no second properties file is
# used. Ported from dpn-federator-gateway's common-configuration.properties.
#
# idp.truststore.path above is REUSED for this client's transport connection to Keycloak by
# default (see HttpClientFactoryUtils.createHttpClient(Properties, String)'s idp.-fallback) -
# set redis.idp.truststore.path/password below only if a different truststore is required.
#
# redis.idp.client.secret is intentionally left BLANK here - supply the real value via a JVM
# system property (-Dredis.idp.client.secret=...) or a mounted secret, never as a literal here.
redis.idp.token.url=https://localhost:8443/realms/dpn-realm/protocol/openid-connect/token
redis.idp.client.id=dpn-service-client
redis.idp.client.secret=
redis.idp.truststore.path=
redis.idp.truststore.password=

# ============================================
# Redis TLS configuration
# ============================================
# redis.host/redis.port/redis.prefix remain in server.properties since they are legitimately
# per-deployment-target values (see charts/dpn-redis and charts/dpn-rest-federator, which
# template them separately).
#
# Redis TLS is controlled by redis.tls.enabled below, defaulting to true if absent - matching
# the gRPC Federator Gateway's actual RedisUtil code exactly. It is completely independent of
# keycloak.auth.enabled above, which affects authentication only, never transport.
#
# truststore.path/password below point at the common DPN certificate trust bundle used to
# verify the Redis server's certificate (with SAN/hostname verification), when TLS is enabled.
# If TLS is enabled but this truststore cannot be loaded, the connection falls back to a plain
# TLS connection using the JVM's default trust store, rather than crashing outright (hostname
# verification itself stays enabled either way - see RedisUtil.buildRedisConnection). If TLS is
# disabled (redis.tls.enabled=false), the connection is plain, matching pre-TLS behaviour exactly.
#
# The literal password value below is the local-dev fallback default, matching
# idp.truststore.password's own identical pattern above - it is overridden from Vault via
# PropertyUtil.VaultMappings (REDIS_TRUSTSTORE_PASSWORD, reusing the same
# VAULT_TRUSTSTORE_PASSWORD_PATH env var already used for client/server/idp, since it is the
# same common DPN truststore, not a separately-provisioned secret) whenever the secret
# provider is enabled - never supplied as a real secret via this literal in any environment
# that actually runs with one.
redis.tls.enabled=true
redis.truststore.path=./truststore.jks
redis.truststore.password=changeit
#redis.truststore.path=${REDIS_TRUSTSTORE_PATH}
#redis.truststore.password=${REDIS_TRUSTSTORE_PASSWORD}
