#
# REST Federator Server (gateway) properties.
#
# SCOPE: this file is for LOCAL DEVELOPMENT. The ${VAR} placeholders below are
# literal text — nothing expands them at runtime, so substitute real values (or
# run the file through envsubst) when running locally.
#
# In a cluster these properties are rendered from Helm values into a ConfigMap
# and mounted at /config instead; see
# charts/dpn-rest-federator/templates/rest-federator-server-config.yaml.
#
# Only properties the REST stack actually reads are listed. The gRPC
# Federator's Kafka, file-streaming, cloud-storage (S3/Azure/GCP) and gRPC
# transport settings do not apply here and have been removed.
#
# The file is located via the FEDERATOR_SERVER_PROPERTIES environment
# variable; it defaults to "server.properties" on the classpath.

# Path to the shared IDP/TLS configuration (see common-configuration.properties).
common.configuration=src/configs/common-configuration.properties

# ============================================
# Federator identity
# ============================================

# Producer ID for this federator instance. Optional.
federator.producer.id=

# ============================================
# Management Node
# ============================================

# Base URL of the Management Node, which serves this producer's configuration
# (registered REST products, their consumers and allowed paths).
management.node.base.url=https://localhost:8090

# Request timeout in seconds for Management Node calls.
management.node.request.timeout=5

# How long a fetched configuration is cached locally, in seconds.
management.node.cache.ttl.seconds=60

# ============================================
# Management Node resilience (retry / circuit breaker)
# ============================================
# All optional — the defaults shown are applied when a property is absent.

# Attempts before giving up on a failing call.
management.node.resilience.retry.maxAttempts=10

# Delay before the first retry (ISO-8601 duration).
management.node.resilience.retry.initialWait=PT0.2S

# Upper bound on the exponential backoff between retries.
management.node.resilience.retry.maxBackoff=PT15M

# Comma-separated Throwable classes eligible for retry.
management.node.resilience.retry.retryOn=java.io.IOException,java.net.SocketTimeoutException

# Failure percentage at which the breaker opens.
management.node.resilience.circuitBreaker.failureRateThreshold=50

# Number of calls evaluated when calculating the failure rate.
management.node.resilience.circuitBreaker.slidingWindowSize=10

# Minimum calls before the breaker evaluates the failure rate.
management.node.resilience.circuitBreaker.minimumNumberOfCalls=20

# Concurrent trial calls permitted while half-open.
management.node.resilience.circuitBreaker.permittedNumberOfCallsInHalfOpenState=1

# How long the breaker stays open before going half-open.
management.node.resilience.circuitBreaker.waitDurationInOpenState=PT60S

# ============================================
# Redis — IDP access-token cache
# ============================================
# Deployed by the dpn-redis Helm chart.

redis.host=localhost
redis.port=6379

# An empty value means false; omitting the property entirely means true.
redis.tls.enabled=false

# Key prefix for entries written by this instance.
redis.prefix=federator-server

# Set only if the Redis instance requires authentication. Leave the username
# empty when only a password is needed.
redis.username=
redis.password=

# Base64-encoded AES key used to encrypt cached access tokens.
redis.aes.key=
