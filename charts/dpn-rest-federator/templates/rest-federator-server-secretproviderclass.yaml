{{- if .Values.keyvault.enabled }}
# Syncs secrets from Azure Key Vault into a Kubernetes Secret via the
# secrets-store CSI driver.
#
# The object list is deliberately configurable rather than fixed: the federator
# gateway pulls its Kafka and blob-storage credentials here, neither of which
# the REST stack uses. Declare only what this gateway needs — by default the
# backend API key.
#
# Point restFederatorServer.backend.apiKeySecret.name at .Values.keyvault
# .secretName to have the gateway read the key from the synced Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.restFederatorServer.name }}-kv-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.restFederatorServer.name }}
spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.keyvault.clientID | quote }}
    keyvaultName: {{ .Values.keyvault.name | quote }}
    tenantId: {{ .Values.keyvault.tenantId | quote }}

    objects: |
      array:
        {{- range .Values.keyvault.objects }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
        {{- end }}

  secretObjects:
    - secretName: {{ .Values.keyvault.secretName }}
      type: Opaque
      data:
        {{- range .Values.keyvault.objects }}
        - objectName: {{ .objectName }}
          key: {{ .key }}
        {{- end }}
{{- end }}
