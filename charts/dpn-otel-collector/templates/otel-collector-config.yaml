apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.otelCollector.name }}-config
  namespace: {{ .Release.Namespace }}
data:
  # Mirrors dpn-federator's docker/otel-collector-config.yaml: OTLP in, debug
  # exporter out — enough to confirm spans/logs/metrics are arriving before
  # ever wiring up a real backend.
  otel-collector-config.yaml: |
    {{- if .Values.otelCollector.auth.enabled }}
    extensions:
      oidc:
        issuer_url: {{ .Values.otelCollector.auth.oidcIssuerUrl | quote }}
        audience: {{ .Values.otelCollector.auth.audience | quote }}
    {{- end }}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            {{- if .Values.otelCollector.tls.enabled }}
            tls:
              cert_file: /tls/tls.crt
              key_file: /tls/tls.key
            {{- end }}
            {{- if .Values.otelCollector.auth.enabled }}
            auth:
              authenticator: oidc
            {{- end }}

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      debug:
        verbosity: detailed

    service:
      {{- if .Values.otelCollector.auth.enabled }}
      extensions: [oidc]
      {{- end }}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
