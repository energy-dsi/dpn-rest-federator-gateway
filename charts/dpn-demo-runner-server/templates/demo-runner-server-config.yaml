# Properties files mounted at /config for demo-runner-server.
#
# Mirrors charts/dpn-rest-federator/templates/rest-federator-server-config.yaml: renders
# server.properties/common-configuration.properties from Helm values instead of a checked-in
# properties file, so FEDERATOR_SERVER_PROPERTIES (set in
# demo-runner-server-deployment.yaml, pointing at demoRunnerServer.serverProperties.mountPath)
# resolves to real content instead of a missing ConfigMap.
#
# Unlike the gateway, this app has no idp.* (private_key_jwt/mTLS) client of its own - it only
# needs the redis.idp.* client for Redis-gating (KeycloakSessionGuard/RedisUtil) and, when
# otel.oauth2.enabled, to authenticate OTLP export (OtelBearerTokenSupport.java).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.demoRunnerServer.serverProperties.configMapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.demoRunnerServer.name }}
data:
  server.properties: |
    common.configuration=/config/common-configuration.properties

    redis.host={{ .Values.demoRunnerServer.redis.host }}
    redis.port={{ .Values.demoRunnerServer.redis.port }}
    redis.prefix={{ .Values.demoRunnerServer.redis.prefix }}

  common-configuration.properties: |
    # ---- Redis TLS + Keycloak gating (see KeycloakAuthConfig / RedisUtil) ----
    # redis.tls.enabled deliberately left unset - RedisUtil defaults it to true, and
    # dpn-redis is TLS-only anyway (see the matching comment on demoRunnerServer.redis
    # above), so there is no unused value key just for this.
    redis.truststore.path={{ .Values.demoRunnerServer.redis.truststorePath }}
    redis.truststore.password={{ .Values.demoRunnerServer.redis.truststorePassword }}

    # Dedicated Keycloak client (dpn-service-client) used to gate Redis access AND, when
    # otel.oauth2.enabled, to authenticate OTLP export (see OtelBearerTokenSupport.java) -
    # this app has no separate idp.* client. redis.idp.client.secret is deliberately not
    # rendered here as a literal - supplied via the dpn-keycloak-secrets Secret /
    # -Dredis.idp.client.secret system property (see redisIdp.clientSecretEnabled in
    # values.yaml and demo-runner-server-deployment.yaml).
    redis.idp.token.url={{ .Values.demoRunnerServer.redisIdp.tokenUrl }}
    redis.idp.client.id={{ .Values.demoRunnerServer.redisIdp.clientId }}
    redis.idp.truststore.path={{ .Values.demoRunnerServer.redisIdp.truststorePath }}
    redis.idp.truststore.password={{ .Values.demoRunnerServer.redisIdp.truststorePassword }}
