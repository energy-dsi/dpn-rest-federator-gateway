imagePullSecret: ghcr-pull-secret

demoRunnerServer:
  name: dpn-demo-runner-server-1
  replicaCount: 1
  image:
    repository: <<your specific value>>/dpn-demo-runner-server
    tag: "1.0.0"
    pullPolicy: Always
  service:
    type: ClusterIP
    # Azure ILB: exposes this service privately inside the VNet.
    internalLoadBalancer: true
    port: 8443
    loadBalancerIP: <<your specific value>>
  # Same Secret the REST Federator gateway reads, so both ends of the
  # gateway -> backend hop share one value.
  apiKeySecret:
    name: dpn-backend-api-key
    key: apiKey
  # Redis instance of this cluster (dpn-redis chart names it dpn-rest-federator-redis-1).
  redis:
    host: dpn-rest-federator-redis-1.ns-dpn-01.svc.cluster.local
  # Keycloak (dpn-service-client) token endpoint used to gate Redis access.
  redisIdp:
    tokenUrl: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm/protocol/openid-connect/token
  otel:
    endpoint: "http://dpn-otel-collector.ns-dpn-health-01.svc.cluster.local:4317"
    protocol: "grpc"
    insecure: "true"
    serviceName: "demo-runner-server"
    tracesSampler: "parentbased_traceidratio"
    tracesSamplerArg: "1.0"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
