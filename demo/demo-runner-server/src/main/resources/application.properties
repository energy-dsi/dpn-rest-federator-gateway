# Demo Runner Server — example backend behind the REST Federator gateway.

spring.application.name=demo-runner-server
server.port=${SERVER_PORT:8443}

# Server-only HTTPS terminated with keystore.jks from the mounted dpn-tls
# platform secret — this backend does NOT talk to the DPN Vault. The gateway
# trusts this certificate with the same DPN truststore it uses for Vault HTTPS
# calls. No server.ssl.client-auth: the shared API key (ApiKeyAuthFilter)
# authenticates the gateway→backend hop, not a client certificate.
#
# A plain file-based JKS bundle; path/password come from env vars injected by
# the Helm chart from the mounted dpn-tls secret. Server-only TLS, so only the
# keystore (this backend's identity) is needed — no truststore, since the
# listener never validates a client certificate (the shared API key does that).
# When TLS material is not mounted (e.g. a plain local run) set SERVER_SSL_ENABLED=false.
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.bundle=demo-runner-tls
spring.ssl.bundle.jks.demo-runner-tls.keystore.location=file:${TLS_KEYSTORE_PATH:/tls/keystore.jks}
spring.ssl.bundle.jks.demo-runner-tls.keystore.password=${TLS_KEYSTORE_PASSWORD:}
spring.ssl.bundle.jks.demo-runner-tls.keystore.type=${TLS_KEYSTORE_TYPE:JKS}

# Shared secret the gateway must present as the X-Backend-Api-Key header.
# Supply via a Kubernetes Secret. Left blank locally, which disables the check
# (a warning is logged at startup so this cannot pass unnoticed).
backend.api-key=${BACKEND_API_KEY:}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Health probes for Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging
logging.level.org.dsi.dpn.demo=INFO
