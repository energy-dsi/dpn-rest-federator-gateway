# Shared DPN — REST Federator + Redis Uninstall pipeline (N instances)
#
# Helm uninstalls the selected SHARED component(s) for instances 02..N.
# The primary releases (dpn-rest-federator, dpn-redis) are NEVER touched —
# use rest-federator-uninstall-cd.yml for them.
#
# totalDpnCount = how many DPNs in total, INCLUDING the primary:
#   3 -> uninstalls shared instances 02 and 03
#
# Releases per instance 0N:
#   rest-federator  ->  dpn-rest-federator-0N
#   redis           ->  dpn-redis-0N
# Order: REST federator first, then Redis (so no server is left without its cache).

trigger: none

pool:
  name: '<<YOUR AGENT POOL>>'

parameters:
- name: ServiceConnection
  displayName: 'ServiceConnection details'
  type: string
  default: 'sc-dpn-dev-001'
  values:
      - sc-dpn-dev-001
      - sc-dpn-dev-002
      - sc-dpn-test-001
      - sc-dpn-test-002
      - sc-dpn-pdev-ppd-001
      - sc-dpn-ptest-ppd-001
      - sc-dpn-puat-ppd-001

- name: environment
  displayName: Environment Name
  type: string
  default: 'dev'
  values:
      - dev
      - devtest
      - test
      - pdev
      - ptest
      - puat

- name: cluster
  displayName: Target DPN Cluster
  type: string
  default: 'dpn01'
  values:
    - dpn01
    - dpn02

- name: totalDpnCount
  displayName: "Total DPNs INCLUDING the primary (e.g. 3 = primary + shared 02, 03). Minimum 2. Uninstalls shared instances 02..N only"
  type: number
  default: 2

- name: component
  displayName: "Shared Component to Uninstall"
  type: string
  default: both
  values:
    - rest-federator
    - redis
    - both

variables:
  - name: TOTAL_DPN
    value: "${{ parameters.totalDpnCount }}"

  - name: PARAMETERS_FILE
    value: .pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.cluster }}.json

  # Approval group
  - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
    - name: APPROVAL_GROUP
      value: dsi-ppd
  - ${{ elseif or(eq(parameters.environment, 'devtest'), eq(parameters.environment, 'test')) }}:
    - name: APPROVAL_GROUP
      value: dsi-devtest
  - ${{ else }}:
    - name: APPROVAL_GROUP
      value: dsi-dev

stages:

- stage: Guard
  displayName: "Guard — DPN Cluster + Instance Count"
  jobs:
  - job: Guard
    steps:
    - checkout: none
    - script: |
        ENV="${{ parameters.environment }}"
        CLUSTER="${{ parameters.cluster }}"
        if printf '%s' "$ENV" | grep -qE '^(pdev|ptest|puat)$' && [ "$CLUSTER" = "dpn02" ]; then
          echo "##[error]cluster=dpn02 is disabled for environment=$ENV. This environment only has dpn01."
          exit 1
        fi
        TOTAL="$(TOTAL_DPN)"
        if ! [[ "$TOTAL" =~ ^[0-9]+$ ]] || [ "$TOTAL" -lt 2 ]; then
          echo "##[error]totalDpnCount must be 2 or more (it counts the primary): got '$TOTAL'."
          exit 1
        fi
        echo "Guard passed: '$ENV' / '$CLUSTER', shared instances 02..$(printf '%02d' "$TOTAL")."
      displayName: "Validate cluster + totalDpnCount"

  # Approval is integrated into the uninstall stage (same pattern as rest-federator-cd.yml).
- stage: Uninstall
  displayName: "Uninstall Shared [${{ parameters.environment }}-${{ parameters.cluster }}] — ${{ parameters.component }}"
  dependsOn: Guard
  condition: succeeded()
  jobs:
  - deployment: Approve
    displayName: "Approval Gate"
    environment: ${{ variables.APPROVAL_GROUP }}
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Approved — uninstalling shared DPN ${{ parameters.component }} for ${{ parameters.environment }}-${{ parameters.cluster }}"
              echo "Instances : $(for i in $(seq 2 $(TOTAL_DPN)); do printf '%02d ' "$i"; done)(primary untouched)"

  - job: UninstallJob
    displayName: "Helm Uninstall (02..${{ parameters.totalDpnCount }})"
    dependsOn: Approve
    steps:
    - checkout: self

    - script: |
        echo "Loading config: $(PARAMETERS_FILE)"
        for param in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
          value=$(jq -r ".\"$param\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")
          echo "##vso[task.setvariable variable=$param]$value"
        done
      displayName: Load Environment Config

    - task: AzureCLI@2
      displayName: "Helm Uninstall — ${{ parameters.component }}"
      inputs:
        azureSubscription: '${{ parameters.ServiceConnection }}'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          if ! command -v kubectl &>/dev/null || ! command -v kubelogin &>/dev/null; then
            az aks install-cli --client-version 1.32.3 --kubelogin-version 0.2.18
          fi
          helm version >/dev/null

          az account set --subscription $(AZURE_SUBSCRIPTION_ID)
          az aks get-credentials \
            --resource-group $(RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

          uninstall() {
            local release=$1
            if helm status "$release" -n $(NAMESPACE) >/dev/null 2>&1; then
              echo "Uninstalling: $release"
              helm uninstall "$release" -n $(NAMESPACE) --wait --timeout 5m
              echo "$release uninstalled successfully"
            else
              echo "$release not found in $(NAMESPACE) — skipping"
            fi
          }

          COMPONENT="${{ parameters.component }}"
          if [ "$COMPONENT" = "rest-federator" ] || [ "$COMPONENT" = "both" ]; then
            for i in $(seq 2 $(TOTAL_DPN)); do uninstall "dpn-rest-federator-$(printf '%02d' "$i")"; done
          fi
          if [ "$COMPONENT" = "redis" ] || [ "$COMPONENT" = "both" ]; then
            for i in $(seq 2 $(TOTAL_DPN)); do uninstall "dpn-redis-$(printf '%02d' "$i")"; done
          fi

          LEFT=0
          for i in $(seq 2 $(TOTAL_DPN)); do
            N=$(printf '%02d' "$i")
            RELEASES=""
            [ "$COMPONENT" != "redis" ] && RELEASES="$RELEASES dpn-rest-federator-$N"
            [ "$COMPONENT" != "rest-federator" ] && RELEASES="$RELEASES dpn-redis-$N"
            for r in $RELEASES; do
              if helm status "$r" -n $(NAMESPACE) >/dev/null 2>&1; then
                echo "##[error]$r is still installed"
                LEFT=1
              fi
            done
          done

          echo "Remaining Helm releases in $(NAMESPACE):"
          helm list -n $(NAMESPACE)
          [ "$LEFT" -eq 0 ] || exit 1
