# CD pipeline for dpn-rest-federator-gateway
#
# Deploys, as separate stages so each can be rolled back independently:
#   1. Deploy_Redis          -- the Redis cache this chart owns
#   2. Deploy_RestFederator  -- the REST Federator gateway itself
#
# Kafka/Zookeeper still come from dpn-platform in this same AKS cluster and are
# not touched here. Redis, however, is now owned by this chart (redisCache.*)
# rather than shared, so the gateway's cache lifecycle follows its deployment.
#
# The demo/ example applications have their own pipeline, demo-runner-cd.yml.

trigger: none

pool:
  name: '<<YOUR AGENT POOL>>'

parameters:
- name: ServiceConnection
  displayName: 'ServiceConnection details'
  type: string
  default: 'sc-dpn-dev-001'
  values:
      - sc-dpn-dev-001
      - sc-dpn-dev-002
      - sc-dpn-test-001
      - sc-dpn-test-002
      - sc-dpn-pdev-ppd-001
      - sc-dpn-ptest-ppd-001
      - sc-dpn-puat-ppd-001

- name: environment
  displayName: Environment Name
  type: string
  default: 'dev'
  values:
      - dev
      - devtest
      - test
      - pdev
      - ptest
      - puat

- name: cluster
  displayName: Target DPN Cluster
  type: string
  default: 'dpn01'
  values:
    - dpn01
    - dpn02

- name: imageTag
  type: string
  displayName: 'REST Federator Server Image tag (the CI run''s Build.BuildId, e.g. 236904)'

variables:
  - name: HELM_DIR
    value: charts/dpn-rest-federator
  - name: RELEASE_NAME
    value: dpn-rest-federator

  # Redis is a separate chart and release so it deploys, upgrades and rolls back
  # independently of the gateway.
  - name: REDIS_HELM_DIR
    value: charts/dpn-redis
  - name: REDIS_RELEASE_NAME
    value: dpn-redis

  - name: VALUES_FILE
    value: values-${{ parameters.environment }}-${{ parameters.cluster }}.yaml
  - name: PARAMETERS_FILE
    value: .pipelines/azure-pipelines/config/${{ parameters.environment }}-${{ parameters.cluster }}.json

  # Approval group 
  - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
    - name: APPROVAL_GROUP
      value: dsi-ppd
  - ${{ elseif or(eq(parameters.environment, 'devtest'), eq(parameters.environment, 'test')) }}:
    - name: APPROVAL_GROUP
      value: dsi-devtest
  - ${{ else }}:
    - name: APPROVAL_GROUP
      value: dsi-dev

stages:

  # ---------------------------------------------------------------
  # Redis cache — deployed first, as its own stage, so the gateway
  # comes up with its cache already available.
  #
  # APPROVAL IS INTEGRATED INTO EACH DEPLOY STAGE — deliberately NOT a
  # separate top-level approval stage. A separate stage can be bypassed
  # from the "Stages to run" selector at queue time (deselect it, run
  # only the deploy stage). Instead every deploy stage begins with an
  # environment-bound "Approve" deployment job (dsi-dev / dsi-devtest /
  # dsi-ppd, routed by APPROVAL_GROUP), whose Approval check blocks the
  # run until a named approver signs off, and the real deploy job
  # dependsOn it. Stage selection is stage-level, so the deploy job can
  # never run without its in-stage approval. Running both deploy stages
  # in one run therefore prompts once per stage.
  # ---------------------------------------------------------------
- stage: Deploy_Redis
  displayName: "Deploy Redis Cache to AKS"
  jobs:
  - deployment: Approve
    displayName: "Approval Gate"
    environment: ${{ variables.APPROVAL_GROUP }}
    pool:
      name: '<<YOUR AGENT POOL>>'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Approved — deploying Redis for ${{ parameters.environment }}-${{ parameters.cluster }}"
  - job: DeployRedis
    displayName: "Helm Deploy - Redis"
    dependsOn: Approve

    pool:
      name: '<<YOUR AGENT POOL>>'

    steps:
    - checkout: self

    - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
      - script: |
          if [ "${{ parameters.cluster }}" == "dpn02" ]; then
            echo "##[error]cluster=dpn02 is disabled for environment=${{ parameters.environment }}. This environment only has dpn01."
            exit 1
          fi
        displayName: "Guard: dpn02 disabled for ${{ parameters.environment }}"

    - script: |
        echo "Loading config: $(PARAMETERS_FILE)"
        if [ ! -f "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)" ]; then
          echo "##[error]Config file not found: $(PARAMETERS_FILE)"
          exit 1
        fi
        for param in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
          value=$(jq -r ".\"$param\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")
          echo "##vso[task.setvariable variable=$param]$value"
        done
      displayName: Load Environment Config

    - task: AzureCLI@2
      displayName: "AKS Auth + Helm Deploy (Redis)"
      inputs:
        azureSubscription: '${{ parameters.ServiceConnection }}'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(Build.SourcesDirectory)'
        inlineScript: |
          set -euo pipefail
          cd "$(Build.SourcesDirectory)"

          if ! command -v kubectl &>/dev/null || ! command -v kubelogin &>/dev/null; then
            az aks install-cli --client-version 1.32.3 --kubelogin-version 0.2.18
          fi

          az account set --subscription $(AZURE_SUBSCRIPTION_ID)
          az aks get-credentials \
            --resource-group $(RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

          echo "=========================================="
          echo " HELM VALIDATION - REDIS"
          echo "=========================================="
          helm lint "$(REDIS_HELM_DIR)"
          helm upgrade --install $(REDIS_RELEASE_NAME) "$(REDIS_HELM_DIR)" \
            -n $(NAMESPACE) \
            -f "$(REDIS_HELM_DIR)/$(VALUES_FILE)" \
            --dry-run --debug >/dev/null
          echo "Helm dry-run successful"

          echo "=========================================="
          echo " HELM DEPLOY - REDIS"
          echo "=========================================="
          helm upgrade --install $(REDIS_RELEASE_NAME) "$(REDIS_HELM_DIR)" \
            -n $(NAMESPACE) \
            -f "$(REDIS_HELM_DIR)/$(VALUES_FILE)" \
            --debug

          echo "=========================================="
          echo " POST-DEPLOY VERIFICATION - REDIS"
          echo "=========================================="
          REDIS_NAME=$(helm get values $(REDIS_RELEASE_NAME) -n $(NAMESPACE) -a -o json \
            | jq -r '.redisCache.name')
          if [ -z "$REDIS_NAME" ] || [ "$REDIS_NAME" == "null" ]; then
            echo "##[error]Could not resolve the Redis deployment name from Helm values"
            exit 1
          fi
          echo "Redis deployment: ${REDIS_NAME}"

          kubectl rollout status deployment/${REDIS_NAME} -n $(NAMESPACE) --timeout=300s
          kubectl get svc -n $(NAMESPACE) -l app=${REDIS_NAME}
          kubectl get pods -n $(NAMESPACE) -l app=${REDIS_NAME}
          helm status $(REDIS_RELEASE_NAME) -n $(NAMESPACE)

          echo "=========================================="
          echo " REDIS DEPLOYMENT COMPLETE"
          echo "=========================================="

- stage: Deploy_RestFederator
  displayName: "Deploy REST Federator to AKS"
  dependsOn:
    - Deploy_Redis
  jobs:
  - deployment: Approve
    displayName: "Approval Gate"
    environment: ${{ variables.APPROVAL_GROUP }}
    pool:
      name: '<<YOUR AGENT POOL>>'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Approved — deploying REST Federator for ${{ parameters.environment }}-${{ parameters.cluster }}"
  - job: Deploy
    displayName: "Helm Deploy - REST Federator"
    dependsOn: Approve

    pool:
      name: '<<YOUR AGENT POOL>>'

    steps:
    - checkout: self

    # pdev, ptest and puat only run a single DPN (dpn01). dpn02 is not
    # provisioned in those environments, so fail fast rather than deploying
    # against a values/config file that doesn't exist.
    - ${{ if or(eq(parameters.environment, 'pdev'), eq(parameters.environment, 'ptest'), eq(parameters.environment, 'puat')) }}:
      - script: |
          if [ "${{ parameters.cluster }}" == "dpn02" ]; then
            echo "##[error]cluster=dpn02 is disabled for environment=${{ parameters.environment }}. This environment only has dpn01."
            exit 1
          fi
        displayName: "Guard: dpn02 disabled for ${{ parameters.environment }}"

    - script: |
        echo "Loading config: $(PARAMETERS_FILE)"
        if [ ! -f "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)" ]; then
          echo "##[error]Config file not found: $(PARAMETERS_FILE)"
          exit 1
        fi
        for param in $(jq -r 'keys_unsorted | .[]' "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)"); do
          value=$(jq -r ".\"$param\"" "$(Build.SourcesDirectory)/$(PARAMETERS_FILE)")
          echo "##vso[task.setvariable variable=$param]$value"
        done
      displayName: Load Environment Config

    - task: AzureCLI@2
      displayName: "AKS Auth + Helm Deploy"
      inputs:
        azureSubscription: '${{ parameters.ServiceConnection }}'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(Build.SourcesDirectory)'
        inlineScript: |
          set -euo pipefail
          cd "$(Build.SourcesDirectory)"
          echo "Working directory: $(pwd)"
          ls -la charts/dpn-rest-federator || echo "##[warning]charts/dpn-rest-federator not found here -- check working directory and repo checkout"

          echo "================================================="
          echo " INSTALL TOOLS"
          echo "================================================="
          if ! command -v kubectl &>/dev/null || ! command -v kubelogin &>/dev/null; then
            az aks install-cli --client-version 1.32.3 --kubelogin-version 0.2.18
          else
            echo "kubectl and kubelogin already installed, skipping"
          fi
          kubectl version --client >/dev/null
          kubelogin --version >/dev/null
          helm version >/dev/null
          echo "Tools installed"

          echo "=========================================="
          echo " AZURE AUTH"
          echo "=========================================="
          az account set --subscription $(AZURE_SUBSCRIPTION_ID)
          az account show >/dev/null
          echo "Azure auth OK"

          echo "=========================================="
          echo " AKS CONTEXT"
          echo "=========================================="
          az aks get-credentials \
            --resource-group $(RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing

          kubelogin convert-kubeconfig -l azurecli
          echo "AKS context ready"

          echo "=========================================="
          echo " FETCH VAULT TRUSTSTORE PASSWORD"
          echo "=========================================="
          # Only needed when this environment's vault.authMethod is "token" --
          # AppRole environments renew their own lease and don't need this.
          # TRUSTSTORE-PASSWORD is the canonical, actively-rotated Key Vault
          # object dpn-tls-cd (dpn-federator-certificate-manager) writes on
          # every cert renewal. VAULT-TRUSTSTORE-PASSWORD is a bootstrap-only
          # artifact (vault-tls-bootstrap-cd) that's never touched again once
          # an environment is stood up, so it can drift stale after rotation.
          VAULT_TRUSTSTORE_PASSWORD=$(az keyvault secret show \
            --vault-name $(KEY_VAULT_NAME) \
            --name TRUSTSTORE-PASSWORD \
            --query value -o tsv)

          echo "=========================================="
          echo " HELM VALIDATION"
          echo "=========================================="
          echo "HELM DIRECTORY is: $(HELM_DIR)"
          helm lint "$(HELM_DIR)"
          echo "========HELM Upgrade Process about to Commence===================="
          helm upgrade --install $(RELEASE_NAME) "$(HELM_DIR)" \
            -n $(NAMESPACE) \
            --set restFederatorServer.image.repository="$(CONTAINER_REGISTRY_URL)/dpn-rest-federator-server" \
            --set restFederatorServer.image.tag="${{ parameters.imageTag }}" \
            --set restFederatorServer.vault.truststorePassword="$VAULT_TRUSTSTORE_PASSWORD" \
            -f "$(HELM_DIR)/$(VALUES_FILE)" \
            --dry-run --debug >/dev/null

          echo "Helm dry-run successful"

          echo "=========================================="
          echo " HELM DEPLOY"
          echo "=========================================="
          helm upgrade --install $(RELEASE_NAME) "$(HELM_DIR)" \
            -n $(NAMESPACE) \
            --set restFederatorServer.image.repository="$(CONTAINER_REGISTRY_URL)/dpn-rest-federator-server" \
            --set restFederatorServer.image.tag="${{ parameters.imageTag }}" \
            --set restFederatorServer.vault.truststorePassword="$VAULT_TRUSTSTORE_PASSWORD" \
            -f "$(HELM_DIR)/$(VALUES_FILE)" \
            --debug

          echo "=========================================="
          echo " POST-DEPLOY VERIFICATION"
          echo "=========================================="

          case "${{ parameters.environment }}" in
            pdev) CLUSTER_NUM=2 ;;
            ptest|puat) CLUSTER_NUM=1 ;;
            *)
              case "${{ parameters.cluster }}" in
                dpn01) CLUSTER_NUM=1 ;;
                dpn02) CLUSTER_NUM=2 ;;
                *) echo "##[error]Unknown cluster: ${{ parameters.cluster }}"; exit 1 ;;
              esac
              ;;
          esac
          SERVER_NAME="dpn-rest-federator-server-${CLUSTER_NUM}"

          echo " Checking REST Federator Deployment..."
          if ! kubectl rollout status deployment/${SERVER_NAME} -n $(NAMESPACE) --timeout=300s; then
            echo "##[error]Rollout did not complete -- dumping diagnostics"
            echo "---- pods ----"
            kubectl get pods -n $(NAMESPACE) -l app=${SERVER_NAME} -o wide
            echo "---- describe ----"
            kubectl describe pods -n $(NAMESPACE) -l app=${SERVER_NAME}
            echo "---- current container logs ----"
            kubectl logs -n $(NAMESPACE) -l app=${SERVER_NAME} --tail=300 --all-containers=true || true
            echo "---- previous container logs (if it crashed/restarted) ----"
            kubectl logs -n $(NAMESPACE) -l app=${SERVER_NAME} --tail=300 --all-containers=true --previous || true
            exit 1
          fi

          echo " Checking Service..."
          kubectl get svc -n $(NAMESPACE) -l app=${SERVER_NAME}

          echo " Checking Pods..."
          kubectl get pods -n $(NAMESPACE) -l app=${SERVER_NAME}

          echo " Helm Status..."
          helm status $(RELEASE_NAME) -n $(NAMESPACE)

          echo "=========================================="
          echo " CAPTURE DEPLOYED IMAGE DIGEST"
          echo "=========================================="

          SERVER_DIGEST=$(kubectl get pods -n $(NAMESPACE) \
            -l app=${SERVER_NAME} \
            -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')

          if [ -z "$SERVER_DIGEST" ]; then
            echo "##[error]Could not resolve deployed image digest from pod status"
            exit 1
          fi

          echo "REST Federator Server image digest: $SERVER_DIGEST"

          mkdir -p $(Build.ArtifactStagingDirectory)/deployed-digest

          {
            echo "$SERVER_DIGEST"
            echo "component=rest-federator-server"
            echo "environment=${{ parameters.environment }}"
            echo "cluster=${{ parameters.cluster }}"
            echo "imageTag=${{ parameters.imageTag }}"
          } > $(Build.ArtifactStagingDirectory)/deployed-digest/rest-federator-server-digest.txt

          echo "Digest written to artifact staging directory"

          echo "=========================================="
          echo "REST FEDERATOR DEPLOYMENT COMPLETE"
          echo "=========================================="

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Deployed Image Digest'
      inputs:
        pathtoPublish: '$(Build.ArtifactStagingDirectory)/deployed-digest'
        ArtifactName: 'deployed-image-digest'
