parameters:
- name: fossaProjectName
  displayName: 'Mandatory Field*:Enter fossaProjectName'
  type: string
- name: failOnIssues
  type: boolean
  default: true

steps:
  # Every step below is non-blocking (continueOnError: true): FOSSA policy
  # violations are frequently licensing decisions (e.g. an allowed/denied
  # license classification) that need a human call in the FOSSA dashboard,
  # not a code change, so they should surface as a visible warning rather
  # than gate the pipeline. Genuine dependency vulnerabilities are still
  # caught by Checkmarx SCA in the parallel stage, which does gate the build.
  - script: |
      set -e
      curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash
      fossa --version
    displayName: 'Install FOSSA CLI'
    continueOnError: true

  - script: |
      set -e
      fossa analyze --project '${{ parameters.fossaProjectName }}' --branch "$(Build.SourceBranchName)"
    displayName: 'FOSSA Analyze (dependency scan)'
    env:
      FOSSA_API_KEY: $(FOSSA_API_KEY)
    condition: always()
    continueOnError: true

  - script: |
      set -o pipefail
      mkdir -p fossa-report
      fossa test --project '${{ parameters.fossaProjectName }}' --format json | tee fossa-report/fossa_issues.json
    displayName: 'FOSSA Test (policy gate)'
    env:
      FOSSA_API_KEY: $(FOSSA_API_KEY)
    condition: always()
    continueOnError: true

  - script: |
      set -e
      mkdir -p fossa-report
      fossa report attribution --format json --project '${{ parameters.fossaProjectName }}' > fossa-report/attribution.json
    displayName: 'Generate FOSSA Attribution Report'
    env:
      FOSSA_API_KEY: $(FOSSA_API_KEY)
    condition: always()
    continueOnError: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish FOSSA Report'
    inputs:
      targetPath: 'fossa-report'
      artifactName: 'FOSSA-Report'
    condition: always()
    continueOnError: true
